name: Live API

# Checks the client against the real Rebrickable API, to catch API changes.
# Needs the repository secret REBRICKABLE_API_KEY. Never runs on pull requests.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api

jobs:
  live:
    name: Live API checks
    runs-on: ubuntu-latest
    env:
      REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
    steps:
      - name: Require the API key secret
        # Without it the live tests would skip and the run would pass while testing nothing
        run: |
          if [ -z "$REBRICKABLE_API_KEY" ]; then
            echo "::error::Add the REBRICKABLE_API_KEY repository secret to run live API checks."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Re-capture fixtures and check the models still match
        run: |
          yarn fixtures
          yarn typecheck
      - name: Run the live tests
        run: yarn vitest run src/__tests__/live.spec.ts
